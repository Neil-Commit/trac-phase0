[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trac-phase0"
version = "0.1.0"
description = "TRAC Phase 0: laptop AprilTag tracking and navigation-decision simulator"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
trac-sim = "trac.app:main"
trac-calibrate = "trac.calibrate:main"
trac-tags = "trac.generate_tags:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
